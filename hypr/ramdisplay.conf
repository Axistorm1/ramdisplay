# ramdisplay — Hyprland integration
#
# Drop this file into ~/.config/hypr/conf.d/ and make sure your hyprland.conf
# has `source = ~/.config/hypr/conf.d/*.conf`, or just paste these lines into
# hyprland.conf directly.

# ---------------------------------------------------------------------------
# Launch
# ---------------------------------------------------------------------------
# `exec-once` runs through `sh -c`, so `~` expands correctly.
# Use the absolute path if you installed the binary somewhere unusual.
# Full-screen (100vw x 100vh) is the default; `--cell` sets the glyph size.
exec-once = ~/.cargo/bin/ramdisplay --cell 18 --fps 60

# Other flavours:
# exec-once = ~/.cargo/bin/ramdisplay --glyphs binary --fps 60
# exec-once = ~/.cargo/bin/ramdisplay --glyphs decimal --cell 20
# exec-once = ~/.cargo/bin/ramdisplay --windowed --size 600 --fps 60
# exec-once = ~/.cargo/bin/ramdisplay --theme cyberpunk --font "Fira Code"
# exec-once = ~/.cargo/bin/ramdisplay --theme amber --no-bloom --cell 20

# ---------------------------------------------------------------------------
# Layer rules
# ---------------------------------------------------------------------------
# The namespace defaults to "ramdisplay" (override with --namespace).
# These rules are OPTIONAL — the app already installs an empty input region and
# uses the background layer — but they make the intent explicit.

# Ignore pointer events on fully transparent pixels.
layerrule = ignorezero, ramdisplay

# Don't play a fade/slide animation when the surface appears or disappears.
layerrule = noanim, ramdisplay

# Cosmetic, GPU-expensive: blur the wallpaper behind the widget.
# layerrule = blur, ramdisplay
# layerrule = xray, ramdisplay
